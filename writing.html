<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Some thoughts - Ed Tsoi</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <h1><a href="index.html">Ed Tsoi</a></h1>
            <div class="nav-right">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="writing.html">Some thoughts</a></li>
                </ul>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <main>
        <section class="thoughts">
            <h2>Some thoughts</h2>
            
            <div class="topics-container">
                <div class="topic-category">
                    <h3>Entrepreneurship</h3>
                    <ul class="topic-links">
                        <li><a href="writing/founder-paradox.html">Founder Paradox</a></li>
                    </ul>
                </div>

                <div class="topic-category">
                    <h3>People & Inspiration</h3>
                    <ul class="topic-links">
                        <li><a href="writing/founders-inspired-me.html">Founders that have inspired me</a></li>
                    </ul>
                </div>
            </div>
        </section>
    </main>
    
    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.querySelector('.theme-icon');
        const body = document.body;
        
        // Check for saved theme preference or default to dark mode
        const currentTheme = localStorage.getItem('theme') || 'dark';
        body.setAttribute('data-theme', currentTheme);
        
        // Update icon based on current theme
        function updateThemeIcon(theme) {
            themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        
        // Set initial icon
        updateThemeIcon(currentTheme);
        
        // Theme toggle event listener
        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });
    </script>
</body>
</html>
